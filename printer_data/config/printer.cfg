# Voron 2.4 - 300mm - Fysetc Spider 2.2 - EBB36 + Cartographer V4 over CAN
#
# Config layout:
#   hardware/  what the machine is made of, and on which pins
#   leds/      the two neopixel chains, their effects, and the STATUS_* macros
#   macros/    what the machine does
#
# Hardware inventory, CAN UUIDs and the full restore procedure live in the
# README of the backup repo: https://github.com/pmelero/voron-config
#
# The CAN bus does not come from the Spider: a BTT U2C V2.1 running
# candleLight firmware bridges USB to can0 at 1 Mbit/s, and both the EBB36
# toolhead board and the Cartographer probe hang off it. The Spider itself
# talks to the host over plain USB. The screen is a BTT PITFT43 V2.0 on the
# Pi, driven by KlipperScreen - see hardware/display.cfg.
#
# Spider firmware: in menuconfig enable "extra low-level configuration setup",
# select the 12MHz crystal and the USB interface. Flash to 0x08000000.
#
# The SAVE_CONFIG block at the end of this file is auto-generated by Klipper -
# it holds the bed/hotend PID, the bed mesh and the Cartographer scan and touch
# models. Do not edit it by hand.

#####################################################################
#	Includes
#####################################################################

## Hardware
[include hardware/steppers.cfg]
[include hardware/extruder.cfg]
[include hardware/bed.cfg]
[include hardware/probe.cfg]
[include hardware/homing.cfg]
[include hardware/fans.cfg]
[include hardware/temperature.cfg]
[include hardware/filament_sensors.cfg]
[include hardware/display.cfg]
[include hardware/input_shaper.cfg]

## LEDs - hardware first, then the effects that drive it
[include leds/hardware.cfg]
[include leds/effects.cfg]
[include leds/macros.cfg]

## Macros - variables first, the rest read their geometry from it
[include macros/variables.cfg]
[include macros/print_control.cfg]
[include macros/filament.cfg]
[include macros/print_start_end.cfg]
[include macros/bedfans.cfg]
[include macros/clean_nozzle.cfg]
[include macros/test_speed.cfg]
[include macros/update_git.cfg]

## Third-party plugins - these sit at the config root because that is where
## their own installers and docs put them. The wildcards are deliberate:
## Klipper treats an include glob that matches nothing as empty instead of
## failing, so a fresh restore boots even before the plugins are reinstalled.
## See the repo README.
[include timelapse*.cfg]
[include KAMP_Settings.cfg]

#####################################################################
#	General Settings
#####################################################################

[exclude_object]

[respond]

[firmware_retraction]
retract_length: 0.5
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 25

[gcode_arcs]
resolution: 0.1

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

#####################################################################
#	MCU Definitions
#####################################################################

[mcu]
##	The Spider talks over plain USB, not the Pi's uart0. Re-derive this id
##	with "ls -l /dev/serial/by-id/", unplugging the board to see which
##	entry disappears.
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_1E0027000F51303530323539-if00

[mcu EBBCan]
#canbus_uuid: 95b4bab5914c #EBB36 WWG2
canbus_uuid: a701c91bc20c #EBB36 WWBMG (Dual sensor)

#####################################################################
#	Printer Kinematics
#####################################################################

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 4000			        #Max 4000
max_z_velocity: 15			#Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

#####################################################################
#	Idle Timeout
#####################################################################

[idle_timeout]
timeout: 1800
gcode:
    # Only kill heaters and motors when we are not sitting in a pause: a paused
    # print still needs its position held and its bed hot to be resumable.
    {% if not printer.pause_resume.is_paused %}
            TURN_OFF_HEATERS
            M84
            STATUS_READY
    {% else %}
        M104 S0     ; hotend only - keep the bed and the steppers alive
    {% endif %}

