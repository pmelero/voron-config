#####################################################################
#	Case LEDs
#####################################################################

[neopixel caselight]
pin: PD3                         # Change this to the correct pin for your board
chain_count: 36                  # Number of LEDs in the strip
color_order: GRB                 # WS2812 typically uses GRB
initial_red: 0.1                 # Optional: initial color when Klipper starts
initial_green: 0.1
initial_blue: 0.1

#####################################################################
#	Toolhead LEDs (StealthBurner)
#####################################################################
# Hardware definition only. These LEDs are driven by led_effect:
# the effects live in leds/effects.cfg and the STATUS_* macros that
# trigger them in leds/macros.cfg.
#
# The original set_led based macros from the Voron StealthBurner
# template were removed when this chain moved to led_effect - both
# systems cannot drive the same chain at once.
#
# Index 1 = logo, index 2-3 = nozzle.
# This is an RGBW chain, so led_effect palettes take (R,G,B,W).
#
# Original template contributed by Voron discord users wile.e,
# Tetsunosuke, and etherwalker.

[neopixel sb_leds]
pin: EBBCan:PD3
#   The pin connected to the neopixel. This parameter must be provided.
chain_count: 3
#   The number of Neopixel chips that are "daisy chained" to the
#   provided pin. The default is 1 (which indicates only a single
#   Neopixel is connected to the pin).
color_order: GRBW
#   Set the pixel order required by the LED hardware. Options are GRB,
#   RGB, GRBW, or RGBW. The default is GRB.
initial_red: 1.0
initial_green: 0.0
initial_blue: 1.0
initial_white: 0.0
#   Sets the initial LED color of the Neopixel. Each value should be
#   between 0.0 and 1.0. The WHITE option is only available on RGBW
#   LEDs. The default for each color is 0.
