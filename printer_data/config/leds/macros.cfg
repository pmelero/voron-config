#####################################################################
#	LED Macros
#####################################################################
# The STATUS_* macros keep the names used by the StealthBurner config
# so PRINT_START and the other print macros work unchanged - only the
# implementation moved from set_led to led_effect.
#
# The effects themselves are in leds/effects.cfg and the two neopixel
# chains in leds/hardware.cfg.
#
# REPLACE=1 stops any competing effect running on the same LEDs, so
# each macro fully takes over both chains.

#####################################################################
#	Manual Control
#####################################################################

[gcode_macro LED_ON]
description: Case light and nozzle at full brightness.
gcode:
    SET_LED_EFFECT EFFECT=case_on REPLACE=1
    SET_LED_EFFECT EFFECT=sb_nozzle_on REPLACE=1

[gcode_macro LED_DIM]
description: Case light dimmed, nozzle in standby.
gcode:
    SET_LED_EFFECT EFFECT=case_mid REPLACE=1
    SET_LED_EFFECT EFFECT=sb_nozzle_standby REPLACE=1

[gcode_macro LED_OFF]
description: Fade every LED effect out.
gcode:
    STOP_LED_EFFECTS FADETIME=1.0

#####################################################################
#	Print Status
#####################################################################

[gcode_macro STATUS_READY]
description: Idle - logo breathing, case dimmed.
gcode:
    SET_LED_EFFECT EFFECT=sb_logo_ready REPLACE=1
    SET_LED_EFFECT EFFECT=sb_nozzle_standby REPLACE=1
    SET_LED_EFFECT EFFECT=case_idle REPLACE=1

[gcode_macro STATUS_OFF]
description: Alias of LED_OFF, kept for StealthBurner macro compatibility.
gcode:
    LED_OFF

[gcode_macro STATUS_BUSY]
description: Working on something that has no status of its own.
gcode:
    SET_LED_EFFECT EFFECT=sb_logo_busy REPLACE=1
    SET_LED_EFFECT EFFECT=sb_nozzle_on REPLACE=1

[gcode_macro STATUS_HOMING]
description: Homing the axes.
gcode:
    SET_LED_EFFECT EFFECT=sb_logo_homing REPLACE=1
    SET_LED_EFFECT EFFECT=sb_nozzle_on REPLACE=1
    SET_LED_EFFECT EFFECT=case_homing REPLACE=1

[gcode_macro STATUS_HEATING]
description: Waiting for bed or hotend to reach temperature.
gcode:
    SET_LED_EFFECT EFFECT=sb_logo_heating REPLACE=1
    SET_LED_EFFECT EFFECT=sb_nozzle_heating REPLACE=1
    SET_LED_EFFECT EFFECT=case_heating REPLACE=1

[gcode_macro STATUS_LEVELING]
description: Quad gantry level in progress.
gcode:
    SET_LED_EFFECT EFFECT=sb_logo_leveling REPLACE=1
    SET_LED_EFFECT EFFECT=sb_nozzle_on REPLACE=1
    SET_LED_EFFECT EFFECT=case_leveling REPLACE=1

[gcode_macro STATUS_MESHING]
description: Probing the bed mesh.
gcode:
    SET_LED_EFFECT EFFECT=sb_logo_meshing REPLACE=1
    SET_LED_EFFECT EFFECT=sb_nozzle_on REPLACE=1
    SET_LED_EFFECT EFFECT=case_meshing REPLACE=1

[gcode_macro STATUS_CLEANING]
description: Wiping the nozzle on the brush.
gcode:
    SET_LED_EFFECT EFFECT=sb_logo_cleaning REPLACE=1
    SET_LED_EFFECT EFFECT=sb_nozzle_on REPLACE=1
    SET_LED_EFFECT EFFECT=case_cleaning REPLACE=1

[gcode_macro STATUS_CALIBRATING_Z]
description: Finding Z0 with the probe.
gcode:
    SET_LED_EFFECT EFFECT=sb_logo_calibrating_z REPLACE=1
    SET_LED_EFFECT EFFECT=sb_nozzle_on REPLACE=1

[gcode_macro STATUS_PRINTING]
description: Printing.
gcode:
    SET_LED_EFFECT EFFECT=sb_logo_printing REPLACE=1
    SET_LED_EFFECT EFFECT=sb_nozzle_on REPLACE=1
    SET_LED_EFFECT EFFECT=case_printing REPLACE=1

[gcode_macro STATUS_PAUSED]
description: Print paused.
gcode:
    SET_LED_EFFECT EFFECT=sb_logo_paused REPLACE=1
    SET_LED_EFFECT EFFECT=sb_nozzle_on REPLACE=1
    SET_LED_EFFECT EFFECT=case_paused REPLACE=1

[gcode_macro STATUS_COMPLETE]
description: Print finished.
gcode:
    SET_LED_EFFECT EFFECT=sb_logo_complete REPLACE=1
    SET_LED_EFFECT EFFECT=sb_nozzle_standby REPLACE=1
    SET_LED_EFFECT EFFECT=case_complete REPLACE=1

[gcode_macro STATUS_ERROR]
description: Red alert on both chains - call it from your own error handling.
gcode:
    SET_LED_EFFECT EFFECT=sb_error REPLACE=1
    SET_LED_EFFECT EFFECT=case_error REPLACE=1
