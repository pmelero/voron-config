#####################################################################
#	Bed Fans - Config Options
#####################################################################

[gcode_macro _BED_FAN_VARS]
description: Bed fan thresholds and speeds. Storage only.
variable_threshold: 90  # If bed temp target is above this threshold, fans will be enabled. If temp is set to below this threshold, fans will be disabled.
variable_fast: 0.6  # Fan speed once bed temp is reached
variable_slow: 0.2  # Fan speed while bed is heating
variable_filter_speed: 0.6  # Fan speed for the post-print filter run
variable_filter_minutes: 20  # How long the fans keep scrubbing the chamber once the print is done
gcode:

#####################################################################
#	Aliases
#####################################################################

[gcode_macro BED_FANS_SLOW]
description: Bed fans to the slow speed used while heating.
gcode:
    # Vars
    {% set SLOW = printer["gcode_macro _BED_FAN_VARS"].slow|float %}

    UPDATE_DELAYED_GCODE ID=bedfanfilter DURATION=0  # a direct command outranks a pending filter run
    SET_FAN_SPEED FAN=bed_fans SPEED={SLOW}

[gcode_macro BED_FANS_FAST]
description: Bed fans to the fast speed used once at temperature.
gcode:
    # Vars
    {% set FAST = printer["gcode_macro _BED_FAN_VARS"].fast|float %}

    UPDATE_DELAYED_GCODE ID=bedfanfilter DURATION=0  # a direct command outranks a pending filter run
    SET_FAN_SPEED FAN=bed_fans SPEED={FAST}

[gcode_macro BED_FANS_OFF]
description: Stop the bed fans.
gcode:
    UPDATE_DELAYED_GCODE ID=bedfanfilter DURATION=0  # a direct command outranks a pending filter run
    SET_FAN_SPEED FAN=bed_fans SPEED=0

#####################################################################
#	Post-print filter run
#####################################################################

# These fans are THE FILTER's: they pull chamber air through its carbon bed.
# The fumes a hot print leaves behind do not stop when the heaters do, so
# PRINT_END and CANCEL_PRINT keep the fans running afterwards instead of
# letting TURN_OFF_HEATERS below stop them with the bed.
#
# Nothing else in the config does this - every other path here (the
# TURN_OFF_HEATERS override, M190 below the threshold, the [idle_timeout]
# gcode in printer.cfg) stops the fans outright.
#
# filter_minutes has to stay under that [idle_timeout] (1800 s today): the
# timeout also calls TURN_OFF_HEATERS, which would cut the run short.
[gcode_macro BED_FANS_FILTER_RUN]
description: Keep the bed fans running to scrub the chamber. Params - MINUTES, SPEED.
gcode:
    # Vars
    {% set vars = printer["gcode_macro _BED_FAN_VARS"] %}
    # Parameters
    {% set MINUTES = params.MINUTES|default(vars.filter_minutes)|float %}
    {% set SPEED = params.SPEED|default(vars.filter_speed)|float %}

    SET_FAN_SPEED FAN=bed_fans SPEED={SPEED}
    UPDATE_DELAYED_GCODE ID=bedfanfilter DURATION={MINUTES * 60}
    {action_respond_info("Bed fans filtering the chamber for %.0f min" % MINUTES)}

# End of the run. Skipped while a print is running: a print started during
# the run owns the fans now, and stopping them mid-job would let the chamber
# cool down. That print's own M190/M140 already cancelled this timer anyway;
# the guard covers a print started some other way.
[delayed_gcode bedfanfilter]
gcode:
    {% if printer.idle_timeout.state|lower != "printing" %}
        BED_FANS_OFF
    {% endif %}

#####################################################################
#	Command Overrides
#####################################################################

# Override, set fan speeds to low and start monitoring loop.
[gcode_macro SET_HEATER_TEMPERATURE]
description: Override - also drives the bed fans.
rename_existing: _SET_HEATER_TEMPERATURE
gcode:
    # Parameters
    {% set HEATER = params.HEATER|default("None") %}
    {% set TARGET = params.TARGET|default(0)|int %}
    # Vars
    {% set THRESHOLD = printer["gcode_macro _BED_FAN_VARS"].threshold|int %}

    {% if HEATER|lower == "extruder" %}
        M104 S{TARGET}
    {% elif HEATER|lower == "heater_bed" %}
        M99140 S{TARGET}
    {% else %}
        {action_respond_info("Heater %s not supported" % HEATER)}
    {% endif %}

    # Set fans to low if heater_bed temp is requested above threshold temp, and kick off monitoring loop.
    {% if HEATER|lower == "heater_bed" %}
        {% if TARGET >= THRESHOLD %}
            BED_FANS_SLOW
            UPDATE_DELAYED_GCODE ID=bedfanloop DURATION=1
        {% else %}
            BED_FANS_OFF
            UPDATE_DELAYED_GCODE ID=bedfanloop DURATION=0 #	Cancel bed fan loop if it's running
        {% endif %}
    {% endif %}

# Override M190 (Wait for Bed Temperature)
# As a bonus, use TEMPERATURE_WAIT so we don't have to wait for PID to level off.
[gcode_macro M190]
description: Override - wait for bed temp and drive the bed fans.
rename_existing: M99190
gcode:
    # Parameters
    {% set S = params.S|int %}
    # Vars
    {% set THRESHOLD = printer["gcode_macro _BED_FAN_VARS"].threshold|int %}

    {% if S >= THRESHOLD %}
        BED_FANS_SLOW  # >= Threshold temp: Low speed fans while heating
    {% else %}
        BED_FANS_OFF  # < Threshold temp: Turn bed fans off
    {% endif %}

    M140 {% for p in params
        %}{'%s%s' % (p, params[p])}{%
        endfor %}  # Set bed temp

    {% if S != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={S|int} MAXIMUM={S|int + 5}	# Wait for bed temp within 5 degrees
    {% endif %}

    # Post-heating fan speeds
    {% if S >= THRESHOLD %}
        BED_FANS_FAST  # >= Threshold temp: Higher speed fans after heating finished
    {% endif %}

# Replace M140 (Set Bed Temperature) to just be an alias of SET_HEATER_TEMPERATURE (which has associated bed fan logic if enabled)
[gcode_macro M140]
description: Override - set bed temp via SET_HEATER_TEMPERATURE.
rename_existing: M99140
gcode:
    # Parameters
    {% set S = params.S|float %}

    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={S}

# Replace TURN_OFF_HEATERS
[gcode_macro TURN_OFF_HEATERS]
description: Override - also stops the bed fans.
rename_existing: _TURN_OFF_HEATERS
gcode:
    BED_FANS_OFF
    _TURN_OFF_HEATERS

#####################################################################
#	Monitoring Loop
#####################################################################

# Turns bed fans to "fast" speed once target bed temp is reached.
[delayed_gcode bedfanloop]
gcode:
    # Vars
    {% set THRESHOLD = printer["gcode_macro _BED_FAN_VARS"].threshold|int %}

    {% if printer.heater_bed.target >= THRESHOLD %}  # Continue only if target temp greater than threshold.
        {% if printer.heater_bed.temperature|int >= (printer.heater_bed.target|int - 1) %}
            BED_FANS_FAST  # If within 1 degree of target temp: Higher speed fans
        {% else %}
            UPDATE_DELAYED_GCODE ID=bedfanloop DURATION=5  # If temp not reached yet: loop again
        {% endif %}
    {% endif %}
