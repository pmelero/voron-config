#####################################################################
#	Clean Nozzle - Engine
#####################################################################
# _CLEAN_NOZZLE does the work; every CLEAN_* macro below is a thin
# wrapper that calls it with different parameters. Geometry and speeds
# come from _MACHINE_VARS in macros/variables.cfg.

[gcode_macro _CLEAN_NOZZLE]
description: Wipe engine. Call one of the CLEAN_* wrappers instead.
gcode:
    # ---- Parameters (with sensible defaults) ----
    {% set p_wipe_qty   = params.WIPE_QTY|default(10)|int %}
    {% set p_purge      = params.PURGE|default(0)|int %}
    {% set p_purge_len  = params.PURGE_LEN|default(15)|int %}
    {% set p_purge_spd  = params.PURGE_SPD|default(150)|int %}
    {% set p_load       = params.LOAD|default(0)|int %}
    {% set p_load_len   = params.LOAD_LEN|default(60)|int %}
    {% set p_retract    = params.RETRACT|default(10)|int %}
    {% set p_ooze_dwell = params.OOZE_DWELL|default(1)|int %}
    {% set p_park       = params.PARK|default(1)|int %}

    {% set mv = printer["gcode_macro _MACHINE_VARS"] %}
    {% set purge_temp_min = printer.configfile.settings.extruder.min_extrude_temp %}
    {% set max_velocity = printer.configfile.settings.extruder.max_extrude_only_velocity * 60 %}
    {% set wipe_feed = mv.wipe_spd * 60 %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    SAVE_GCODE_STATE NAME=clean_nozzle
    G90

    # Move to bucket
    G1 X{mv.bucket_x} Y{mv.bucket_y} F{mv.prep_spd_xy}
    G1 Z{mv.wipe_start_z} F{mv.prep_spd_z}

    # Purge (optional)
    {% if p_purge and printer.extruder.temperature >= purge_temp_min %}
        M83
        {% if p_load %}
            G1 E{p_load_len} F{max_velocity}
        {% endif %}
        G1 E{p_purge_len} F{p_purge_spd}
        {% if p_retract > 0 %}
            G1 E-{p_retract} F{max_velocity}
        {% endif %}
        {% if p_ooze_dwell > 0 %}
            G4 P{p_ooze_dwell * 1000}
        {% endif %}
        G92 E0
    {% endif %}

    # Wipe: back and forth along X, on two Y lanes 5mm apart
    G1 X{mv.wipe_start_x} Y{mv.wipe_start_y} F{mv.prep_spd_xy}
    {% for _ in range(p_wipe_qty) %}
        G1 X{mv.wipe_start_x + mv.wipe_dist} Y{mv.wipe_start_y} F{wipe_feed}
        G1 X{mv.wipe_start_x} Y{mv.wipe_start_y} F{wipe_feed}
        G1 X{mv.wipe_start_x + mv.wipe_dist} Y{mv.wipe_start_y - 5} F{wipe_feed}
        G1 X{mv.wipe_start_x} Y{mv.wipe_start_y - 5} F{wipe_feed}
    {% endfor %}

    # Step off the brush before lifting, so the nozzle does not drag it
    G1 X{mv.wipe_start_x + mv.wipe_dist - 10} Y{mv.wipe_start_y} F{wipe_feed}
    G1 Z{mv.wipe_lift_z} F{mv.prep_spd_z}

    # Park (optional)
    {% if p_park %}
        G1 X{mv.bucket_x} Y{mv.bucket_y} F{mv.prep_spd_xy}
    {% endif %}

    SET_DISPLAY_TEXT MSG="Nozzle cleaned"
    RESTORE_GCODE_STATE NAME=clean_nozzle

#####################################################################
#	Clean Nozzle - Wrappers
#####################################################################

[gcode_macro CLEAN_NOPURGE]
description: Quick wipe, no purge. Used twice by PRINT_START.
gcode:
    _CLEAN_NOZZLE WIPE_QTY=3 PURGE=0 PARK={params.PARK|default(1)}

[gcode_macro CLEAN_PURGE]
description: Large purge then wipe. For colour or material changes.
gcode:
    _CLEAN_NOZZLE WIPE_QTY=5 PURGE=1 PURGE_LEN=100 PARK={params.PARK|default(1)}

[gcode_macro CLEAN_PRIME]
description: Short prime then wipe, no retract or dwell - ready to print.
gcode:
    _CLEAN_NOZZLE WIPE_QTY=5 PURGE=1 PURGE_LEN=15 RETRACT=0 OOZE_DWELL=0 PARK={params.PARK|default(1)}

[gcode_macro CLEAN_LOAD]
description: Fast-load filament, purge and wipe. Called by LOAD_FILAMENT.
gcode:
    _CLEAN_NOZZLE WIPE_QTY=5 PURGE=1 PURGE_LEN=25 LOAD=1 LOAD_LEN=50 RETRACT=0 OOZE_DWELL=0 PARK={params.PARK|default(1)}

[gcode_macro CLEAN_HOTCOLD]
description: Cold pull style deep clean - heat, cool while wiping hard.
variable_temperature_offset: 30
gcode:
    {% set extruder_target = printer[printer.toolhead.extruder].target %}
    {% set extruder_temperature = printer[printer.toolhead.extruder].temperature %}
    {% set cooltemp_target = extruder_target - temperature_offset %}
    {% set min_extrude_temp = printer.configfile.settings.extruder.min_extrude_temp %}
    {% if extruder_target >= min_extrude_temp and extruder_temperature >= min_extrude_temp %}
        M109 S{extruder_target}
        M104 S{cooltemp_target}
        M106 S255
        G4 P10000
        _CLEAN_NOZZLE WIPE_QTY=50 PURGE=0
        M106 S0
    {% else %}
        {action_respond_info("CLEAN_HOTCOLD needs the hotend hot and at a target above min_extrude_temp.")}
    {% endif %}
