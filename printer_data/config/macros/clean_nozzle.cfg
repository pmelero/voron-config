#####################################################################
#	Clean Nozzle - Engine
#####################################################################

# 2026-11-26: tope de aparcado en X35 Y305 (antes X20; al montar Blobifier se
# movio +19 mm y despues -4 mm). Toda la ruta desplazada +15 mm en X respecto al
# original: entrada X25, cepillo X45-X81, salida X105.

[gcode_macro CLEAN_NOZZLE]
gcode:
    G90                             # PARK and the wipe below use absolute coordinates
    PARK
    
    # Clean nozzle
    G1 X45 F18000
    G1 X81 F18000
    G1 X45 F18000
    G1 X81 F18000
    G1 X45 F18000
    G1 X81 Y305 F18000
    G1 X45 F18000
    G1 X81 F18000
    G1 X45 F18000
    G1 X81 F18000
    G1 X45 F18000
    G1 X105 F18000

    # Move away from brush
    G1 Y270 F18000

[gcode_macro PARK]
gcode:
  {% set restore = params.RESTORE|default("0")|int %}
  {% set x = params.X|default("175")|float %}
  {% set y = params.Y|default("175")|float %}
  {% set f = params.F|default("27000")|int %} #2700
  
  {% if restore == 1 %}
    # Move to coordinates given by HH as we are restoring position
    G90
    G1 X{x} Y{y} F{f}
  
  {% elif ((printer.gcode_move.gcode_position.x - 35)|abs > 0.05)
        or ((printer.gcode_move.gcode_position.y - 305)|abs > 0.05) %}
    # Perform custom park move to the nozzle stop
    SAVE_GCODE_STATE NAME=SET_PARK_STATE
    G90                           # absolute moves even if the caller left G91 active
    
    {% if (printer.gcode_move.gcode_position.y > 297) and (printer.gcode_move.gcode_position.x > 25) %}
      G1 Y297 F{f} #Move infront of the end of the nozzle wiper
    {% endif %}

    G1 X25 F{f}   #Move to the start of the nozzle wiper       
    G1 X25 Y305 F{f}   #Move to the right Y position aligning with the nozzle wiper
    G1 X35 Y305 F{f}   #Move on the nozzle stop
    RESTORE_GCODE_STATE NAME=SET_PARK_STATE
  {% endif %}

[gcode_macro UNPARK]
gcode:
  {% set f = params.F|default("27000")|int %} #
  # Unpark if on the park location
    SAVE_GCODE_STATE NAME=SET_UNPARK_STATE
    G90
    G1 X25 F{f}   #Move to the start of the nozzle wiper       
    RESTORE_GCODE_STATE NAME=SET_UNPARK_STATE
