#####################################################################
#	Machine Geometry
#####################################################################
# Single source of truth for the coordinates several macros need to
# agree on. Read it with:
#
#   {% set mv = printer["gcode_macro _MACHINE_VARS"] %}
#   ... mv.park_x ...
#
# Parking and the purge bucket happen to be the same spot today, but
# they are different ideas: park_* is "somewhere safe to leave the
# toolhead", bucket_* is "where the purge bucket physically is". Keep
# them separate so moving one does not silently move the other.

[gcode_macro _MACHINE_VARS]
description: Shared machine geometry. Storage only - running it does nothing.

# Where the toolhead is left by PRINT_END, PAUSE and CANCEL_PRINT
variable_park_x: 288
variable_park_y: 303

# Purge bucket
variable_bucket_x: 288
variable_bucket_y: 303

# Wipe brush: where the wipe starts and how far it travels (negative = -X)
variable_wipe_start_x: 275
variable_wipe_start_y: 300
variable_wipe_start_z: 1
variable_wipe_dist: -37
variable_wipe_lift_z: 15

# Travel speeds used while cleaning (mm/min, except wipe_spd in mm/s)
variable_prep_spd_xy: 6000
variable_prep_spd_z: 1500
variable_wipe_spd: 200

gcode:
    {action_respond_info("_MACHINE_VARS only stores values; it has no effect.")}
