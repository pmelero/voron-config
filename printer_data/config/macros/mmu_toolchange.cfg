#####################################################################
#   Toolchange sequence (Happy Hare + Crossbow + Blobifier)
#
#   Same sequence as igiannakas (Voron-backups, macros/custom_mmu_macros.cfg),
#   with this printer's points:
#     nozzle stop X35 Y305 (PARK / UNPARK in macros/clean_nozzle.cfg)
#     Crossbow: lever park X0 Y245, cut to Y264 (_MMU_CUT_TIP_VARS)
#     Blobifier tray X5 Y305 (hardware/blobifier.cfg)
#     gantry brush X45-X81 at Y305 (CLEAN_NOZZLE)
#
#   1. Park on the nozzle stop (park_toolchange 35,305 -> _MMU_PARK_MOVE -> PARK)
#   2. To the cutter: UNPARK (X25), down to Y245, in to X0
#   3. Cut, rip with the lever pressed, and straight back to the nozzle stop,
#      so the pushback and the unload happen with the nozzle on the stop
#   4. Load over the Blobifier tray (user_pre_load_extension: BLOBIFIER_PARK)
#   5. Blobifier purge (only PARKs if it is not already at the stop or the tray)
#   6. Quick wipe over the nozzle stop before restoring Z (user_post_purge_extension)
#   7. Brush with CLEAN_NOZZLE (user_post_blobifier_extension)
#   8. Happy Hare goes straight to the next print position (restore_xy_pos: 'next')
#
#   The two _CUT_TIP_* macros replace Happy Hare's (mmu/macros/mmu_cut_tip.cfg):
#   this file is included later, so these definitions win. If Happy Hare changes
#   them in an update, compare and carry the changes over by hand.
#####################################################################

[gcode_macro _CUT_TIP_MOVE_TO_CUTTER_PIN]
description: Helper to move the toolhead to the cutter pin (override: off the nozzle stop in X, then down in Y, then in to the lever)
gcode:
    {% set pin_park_x_loc = params.PIN_PARK_X_LOC|float %}
    {% set pin_park_y_loc = params.PIN_PARK_Y_LOC|float %}
    {% set vars = printer['gcode_macro _MMU_CUT_TIP_VARS'] %}
    {% set travel_speed = vars['travel_speed']|float %}

    UNPARK                                                  # off the nozzle stop, X only (X25)
    _SAFE_G1 Y={pin_park_y_loc} F={travel_speed * 60}       # down the X25 lane to Y245
    _SAFE_G1 X={pin_park_x_loc} F={travel_speed * 60}       # in to the lever at Y245 (it touches at Y250)


[gcode_macro _CUT_TIP_DO_CUT_MOTION]
description: Helper to do a single cut movement (override: back to the nozzle stop right after the cut)
gcode:
    {% set pin_park_x_loc = params.PIN_PARK_X_LOC | float %}
    {% set pin_park_y_loc = params.PIN_PARK_Y_LOC | float %}
    {% set vars = printer['gcode_macro _MMU_CUT_TIP_VARS'] %}
    {% set cutting_axis = vars['cutting_axis'] %}

    {% set pin_loc = vars['pin_loc_compressed']|default(-999)|float %}
    {% if pin_loc != -999 %}
        # Old one-dimensional pin_loc_compressed config
        {% if cutting_axis == "x" %}
            {% set pin_loc_compressed_x = pin_loc %}
            {% set pin_loc_compressed_y = pin_park_y_loc %}
        {% else %}
            {% set pin_loc_compressed_x = pin_park_x_loc %}
            {% set pin_loc_compressed_y = pin_loc %}
        {% endif %}
    {% else %}
        {% set pin_loc_compressed_x, pin_loc_compressed_y = vars.pin_loc_compressed_xy|map('float') %}
    {% endif %}

    {% set cut_fast_move_fraction = vars['cut_fast_move_fraction']|float %}
    {% set cut_fast_move_speed = vars['cut_fast_move_speed']|float %}
    {% set cut_slow_move_speed = vars['cut_slow_move_speed']|float %}
    {% set cut_dwell_time = vars['cut_dwell_time']|float %}
    {% set evacuate_speed = vars['evacuate_speed']|float %}
    {% set rip_length = vars['rip_length']|float %}
    {% set rip_speed = vars['rip_speed']|float %}
    {% set safe_margin_x, safe_margin_y = vars.safe_margin_xy|map('float') %}
    {% set travel_speed = vars['travel_speed']|float %}

    {% set fast_slow_transition_loc_x = (pin_loc_compressed_x - pin_park_x_loc) * cut_fast_move_fraction + pin_park_x_loc|float %}
    {% set fast_slow_transition_loc_y = (pin_loc_compressed_y - pin_park_y_loc) * cut_fast_move_fraction + pin_park_y_loc|float %}

    {% for _ in range (vars.cut_iterations if vars.cut_iterations > 0 else 1) %}
       _SAFE_G1 X={fast_slow_transition_loc_x} Y={fast_slow_transition_loc_y} F={cut_fast_move_speed * 60}   # fast until the blade touches
       _SAFE_G1 X={pin_loc_compressed_x} Y={pin_loc_compressed_y} F={cut_slow_move_speed * 60}             # slow cut

       G4 P{cut_dwell_time}
       {% if loop.last and rip_length > 0 %}
          G1 E-{rip_length} F{rip_speed * 60}             # retract with the lever still pressed
       {% endif %}

       _SAFE_G1 X={pin_park_x_loc} Y={pin_park_y_loc} F={evacuate_speed * 60}   # release the lever

       {% if not loop.last %}
          G4 P500                                         # let the cutter spring back before the next cut
       {% endif %}
    {% endfor %}

    # Clear of the lever on the non-cutting axis
    {% if cutting_axis == "x" %}
       _SAFE_G1 Y={pin_park_y_loc + safe_margin_y} F={travel_speed * 60}
    {% else %}
       _SAFE_G1 X={pin_park_x_loc + safe_margin_x} F={travel_speed * 60}
    {% endif %}

    # Straight back to the nozzle stop: pushback, unload and any ooze happen there.
    # _MMU_PARK_MOVE turns X35 Y305 into PARK (X25 -> Y305 -> X35).
    M400
    _MMU_PARK FORCE_PARK=1 X=35 Y=305 Z_HOP=0


[gcode_macro _PRE_BLOBIFIER_PARK]
description: Blobifier user_pre_blobifier_extension: PARK only if not already at the nozzle stop or over the tray
gcode:
    {% set pos = printer.gcode_move.gcode_position %}
    {% if pos.x > 35.5 or pos.y < 297 %}
        PARK
    {% endif %}
    M400
    MMU_TEST_CONFIG sync_feedback_extrude_threshold=10


[gcode_macro _BLOBIFIER_LEAK_STOP_WIPE]
description: Blobifier user_post_purge_extension: quick wipe over the nozzle stop to break strings, before Z is restored
gcode:
    {% set bl = printer['gcode_macro _BLOBIFIER_VARS'] %}
    {% set safe = printer['gcode_macro _BLOBIFIER_SAFE_DESCEND'] %}
    {% set ignore_safe = safe.print_height < bl.force_safe_descend_height_until %}
    {% if safe.brush or ignore_safe %}
        G90
        G1 X35 Y305 F18000                  # onto the nozzle stop (same Y as the tray, the stop and the brush)
        G1 X57 F18000                       # across the stop into the brush
        G1 X12 F12000                       # back over the stop to the edge of the tray
        G1 X35 F12000                       # end on the stop
    {% else %}
        # Not safe to stay this low: just move X clear of the tray
        G1 X{bl.brush_start} F{bl.travel_spd_xy}
    {% endif %}


[gcode_macro _POST_BLOBIFIER_CLEAN]
description: Blobifier user_post_blobifier_extension: brush on the gantry brush after Z is restored
gcode:
    MMU_TEST_CONFIG sync_feedback_extrude_threshold=3
    M400
    G90
    {% set pos = printer.gcode_move.gcode_position %}
    {% if pos.y >= 303 and pos.x >= 25 and pos.x <= 40 %}
        G1 X35 Y305 F18000                  # already next to the stop: straight on
    {% endif %}
    CLEAN_NOZZLE                            # PARK does not move if at X35 Y305; otherwise it takes the safe route
