#####################################################################
#	PRINT_START / PRINT_END
#####################################################################

[gcode_macro PRINT_START]
description: Slicer start script. Params - BED, EXTRUDER, EXTRUDER_STBY, CHAMBER, SOAK.
gcode:
  # Values come from the slicer's start gcode.
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_extruder_stby = params.EXTRUDER_STBY|default(150)|float %}
  {% set target_chamber = params.CHAMBER|default(0)|int %}
  {% set soak = params.SOAK|default(0)|int %}
  {% set mv = printer["gcode_macro _MACHINE_VARS"] %}
  {% set bedfan_threshold = printer["gcode_macro _BEDFANVARS"].threshold|int %}

  # 1. Ask for heat before anything else. M104 and M140 do not block, so the
  #    bed climbs to temperature while the machine homes - a minute or two
  #    that would otherwise be spent staring at a cold plate.
  M104 S{target_extruder_stby}
  M140 S{target_bed}

  # 2. Start from a known state. _RESET_PRINTER_TO_KLIPPER_CONFIG undoes the
  #    speed, flow, velocity and pressure-advance overrides a previous job or
  #    an interrupted TEST_SPEED can leave behind, and clears the Z offset and
  #    the old mesh. CLEAR_PAUSE drops a pause state left by a cancelled print.
  _RESET_PRINTER_TO_KLIPPER_CONFIG
  CLEAR_PAUSE

  # Sensors off for the whole warm-up: homing, QGL, cleaning and purging
  # all move filament around and would trip them.
  FILAMENT_SENSORS_ENABLE ENABLE=0

  STATUS_HOMING
  G28
  G90

  # 3. Wait for the bed. M190 is overridden in bedfans.cfg, so this also
  #    drives the bed fans on the way up.
  STATUS_HEATING
  SET_DISPLAY_TEXT MSG="Bed: {target_bed}C"
  M190 S{target_bed}

  # 4. Heatsoak, if the slicer asked for one.
  #
  #    This chamber is passive: nothing heats it but the bed and the bed fans.
  #    TEMPERATURE_WAIT cannot be interrupted, so asking it for a temperature
  #    the machine cannot physically reach blocks the print forever with no
  #    way out but cancelling. Prefer SOAK=<minutes>, which always terminates;
  #    use CHAMBER= only for a target you know this printer actually reaches.
  {% if target_chamber > 0 or soak > 0 %}
    # The bed fans are the only thing moving heat into the chamber. The
    # bedfan loop would get them to full speed eventually; during a soak we
    # want them there from the first minute. Below the bed fan threshold
    # there is no chamber to build, so leave them alone.
    {% if target_bed >= bedfan_threshold %}
      BEDFANSFAST
    {% endif %}

    {% if target_chamber > 0 %}
      SET_DISPLAY_TEXT MSG="Chamber: {target_chamber}C"
      TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber}
    {% else %}
      SET_DISPLAY_TEXT MSG="Heatsoak: {soak} min"
      G4 P{soak * 60000}
    {% endif %}
  {% endif %}

  # 5. Level the gantry, now that the frame is at temperature
  STATUS_LEVELING
  SET_DISPLAY_TEXT MSG="Quad gantry level"
  QUAD_GANTRY_LEVEL

  # 6. Clean the nozzle before touching the bed with it
  M109 S{target_extruder_stby}
  STATUS_CLEANING
  SET_DISPLAY_TEXT MSG="Cleaning nozzle"
  CLEAN_NOPURGE PARK=0

  # 7. Find the real Z0, then mesh only the area this print uses.
  #    The touch is a vibration measurement, so approach it from a settled
  #    machine: come to the middle of the bed at a known Z and let the move
  #    queue drain before triggering it, rather than probing straight off
  #    the end of a wipe with moves still in flight. The coordinates are the
  #    bed centre - keep them matching zero_reference_position in
  #    hardware/probe.cfg, which is where the touch is measured anyway.
  G0 X150 Y150 F{mv.prep_spd_xy}
  G0 Z5 F{mv.prep_spd_z}
  M400
  CARTOGRAPHER_TOUCH_HOME
  STATUS_MESHING
  SET_DISPLAY_TEXT MSG="Adaptive bed mesh"
  BED_MESH_CLEAR
  BED_MESH_CALIBRATE ADAPTIVE=1
  G0 X{mv.park_x} Y{mv.park_y} F6000

  # 8. Only now bring the nozzle to printing temperature, and clean
  #    again because it will have oozed while heating.
  #
  #    The part fan at 30% through the climb is what makes that ooze
  #    manageable: molten filament hanging off the tip is the reason this
  #    second clean has to exist at all, and less of it drips onto a bed
  #    that is already at temperature and about to be printed on.
  STATUS_HEATING
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}C"
  M106 S77
  M109 S{target_extruder}
  STATUS_CLEANING
  SET_DISPLAY_TEXT MSG="Cleaning nozzle"
  CLEAN_NOPURGE PARK=0

  # 9. Prime with KAMP's adaptive purge line and hand over to the print.
  #    Fan off first: the purge line needs to stick to the plate, and the
  #    slicer sets its own fan speed for layer one anyway.
  M107
  LINE_PURGE
  STATUS_PRINTING
  FILAMENT_SENSORS_ENABLE ENABLE=1
  SET_DISPLAY_TEXT MSG="Printer goes brr"

[gcode_macro PRINT_END]
description: Slicer end script. Retract, park, cool down.
gcode:
    {% set mv = printer["gcode_macro _MACHINE_VARS"] %}
    {% set th = printer.toolhead %}

    # Step away from the part in XY before lifting, so the nozzle peels off
    # the last layer instead of dragging a string up the side of it. All three
    # are clamped to the build volume: a bare "G91 / G1 Z10" fails on a print
    # that ends near max Z, and that failure aborts PRINT_END *before*
    # TURN_OFF_HEATERS, leaving the machine hot until the idle timeout.
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 10, th.axis_maximum.z]|min %}

    M400                            ; wait for all moves to finish

    G91
    G1 E-2 F1800                    ; retract - keep in sync with KAMP tip_distance
    G90
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000

    TURN_OFF_HEATERS
    M107                            ; part cooling fan off

    G0 X{mv.park_x} Y{mv.park_y} F6000

    # Final frame, with the finished part in shot and the toolhead parked
    # out of the way. Guarded because printer.cfg includes timelapse*.cfg
    # through a wildcard on purpose: on a fresh restore, before the plugin
    # is reinstalled, that glob matches nothing and this command does not
    # exist. Calling it unguarded would abort PRINT_END.
    {% if printer['gcode_macro TIMELAPSE_TAKE_FRAME'] is defined %}
      TIMELAPSE_TAKE_FRAME
    {% endif %}

    # Clears the mesh and the Z offset too, so the machine is left as
    # printer.cfg describes it.
    _RESET_PRINTER_TO_KLIPPER_CONFIG
    STATUS_COMPLETE
