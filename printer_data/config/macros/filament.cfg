#####################################################################
#	Spoolman
#####################################################################

[gcode_macro SET_ACTIVE_SPOOL]
description: Tell Spoolman which spool is loaded. Param - ID.
gcode:
    {% if params.ID %}
        {% set id = params.ID|int %}
        {action_call_remote_method(
            "spoolman_set_active_spool",
            spool_id=id
        )}
    {% else %}
        {action_respond_info("Parameter 'ID' is required")}
    {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
description: Tell Spoolman no spool is loaded.
gcode:
    {action_call_remote_method(
        "spoolman_set_active_spool",
        spool_id=None
    )}

#####################################################################
#	Filament Sensor / Load / Unload
#####################################################################

[gcode_macro FILAMENT_SENSORS_ENABLE]
description: Enable or disable both toolhead filament sensors at once. Param - ENABLE.
gcode:
    {% set enable = params.ENABLE|default(1) %}
    SET_FILAMENT_SENSOR SENSOR=extruder_entry ENABLE={enable}
    SET_FILAMENT_SENSOR SENSOR=extruder_exit ENABLE={enable}

[gcode_macro _GO_TO_BUCKET]
description: Safe path to the purge bucket (X10 Y305), same route as PARK.
gcode:
    {% set f = 18000 %}
    {% set pos = printer.gcode_move.gcode_position %}
    SAVE_GCODE_STATE NAME=go_to_bucket
    G90
    {% if pos.y > 300 and pos.x > 10 %}
        G1 Y297 F{f}                    # step off the brush before moving in X
    {% endif %}
    G1 X10 F{f}
    G1 X10 Y305 F{f}                    # over the purge bucket
    RESTORE_GCODE_STATE NAME=go_to_bucket

[gcode_macro LOAD_FILAMENT]
description: Load and purge filament. If homed, purges over the bucket and cleans the nozzle.
variable_load_distance:  60
variable_purge_distance:  40
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity  * 60 %}
    {% set clean = "xyz" in printer.toolhead.homed_axes and printer.pause_resume.is_paused == false %}
    {% if not printer.extruder.can_extrude %}
        {action_raise_error("LOAD_FILAMENT: hotend at %.0fC, too cold to extrude - heat it first" % printer.extruder.temperature)}
    {% endif %}
    SAVE_GCODE_STATE NAME=load_state
    CLEAR_ACTIVE_SPOOL
    {% if clean %}
        G90
        _GO_TO_BUCKET                   # safe path to X10 Y305, over the purge bucket
    {% endif %}
    G91
    G92 E0
    G1 E{load_distance} F{max_velocity} # fast-load
    G1 E{purge_distance} F{speed} # purge
    {% if clean %}
        G90
        CLEAN_NOZZLE
    {% endif %}
    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro PURGE_FILAMENT]
description: Purge filament already loaded (no fast-load). Same length and speed as the LOAD_FILAMENT purge. If homed, purges over the bucket and cleans the nozzle.
gcode:
    {% set load = printer["gcode_macro LOAD_FILAMENT"] %}
    {% set speed = params.SPEED|default(300) %}
    {% set clean = "xyz" in printer.toolhead.homed_axes and printer.pause_resume.is_paused == false %}
    {% if not printer.extruder.can_extrude %}
        {action_raise_error("PURGE_FILAMENT: hotend at %.0fC, too cold to extrude - heat it first" % printer.extruder.temperature)}
    {% endif %}
    SAVE_GCODE_STATE NAME=purge_state
    {% if clean %}
        G90
        _GO_TO_BUCKET                   # safe path to X10 Y305, over the purge bucket
    {% endif %}
    G91
    G92 E0
    G1 E{load.purge_distance} F{speed} # purge
    {% if clean %}
        G90
        CLEAN_NOZZLE
    {% endif %}
    RESTORE_GCODE_STATE NAME=purge_state

[gcode_macro UNLOAD_FILAMENT]
description: Retract the filament out of the extruder.
variable_unload_distance:  70
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity  * 60 %}
    SAVE_GCODE_STATE NAME=unload_state
    CLEAR_ACTIVE_SPOOL
    G91
    G92 E0
    G1 E-{unload_distance} F{max_velocity} # fast-unload
    RESTORE_GCODE_STATE NAME=unload_state

#####################################################################
#	Filament Change
#####################################################################

# M600: Filament Change. This macro will pause the printer, move the
# tool to the change position, and retract the filament 50mm. Adjust
# the retraction settings for your own extruder. After filament has
# been changed, the print can be resumed from its previous position
# with the "RESUME" gcode.

# Color Change
[gcode_macro M600]
description: Color change
gcode:
    PAUSE
    UNLOAD_FILAMENT
