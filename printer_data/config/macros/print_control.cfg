#####################################################################
#	Print Control - Pause / Resume / Cancel
#####################################################################

[gcode_macro HOME]
description: Home if needed, then move to the middle of the bed.
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G1 X150 Y150 Z50

[pause_resume]
#recover_velocity: 50.
#   When capture/restore is enabled, the speed at which to return to
#   the captured position (in mm/s). Default is 50.0 mm/s.

[gcode_macro PAUSE]
description: Pause the running print and park the toolhead.
rename_existing: PAUSE_BASE
gcode:
  FILAMENT_SENSORS_ENABLE ENABLE=0
  PAUSE_BASE
  _TOOLHEAD_PARK_PAUSE_CANCEL
  STATUS_PAUSED

[gcode_macro RESUME]
description: Resume the running print.
rename_existing: RESUME_BASE
gcode:
  ##### read extrude from  _TOOLHEAD_PARK_PAUSE_CANCEL  macro #####
  {% set extrude = printer['gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL'].extrude %}

  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY) %}
  {% else %}
    {% set get_params = "" %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83
    G1 E{extrude} F2100
    {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}

  FILAMENT_SENSORS_ENABLE ENABLE=1
  STATUS_PRINTING
  RESUME_BASE {get_params}

[gcode_macro CANCEL_PRINT]
description: Cancel the running print, park and turn everything off.
rename_existing: CANCEL_PRINT_BASE
variable_park: True
gcode:
  ## Move head and retract only if not already in the pause state and park set to true
  {% if printer.pause_resume.is_paused|lower == 'false' and park|lower == 'true'%}
    _TOOLHEAD_PARK_PAUSE_CANCEL
  {% endif %}
  M107                                      # turn off fan
  TURN_OFF_HEATERS                          # Turn off all heaters
  CANCEL_PRINT_BASE                         # Call CANCEL_PRINT_BASE to cancel print

[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
description: Helper - retract and park. Used by PAUSE and CANCEL_PRINT.
variable_extrude: 1.0
gcode:
  {% set mv = printer["gcode_macro _MACHINE_VARS"] %}
  {% set z_park_delta = 10.0 %}

  ##### calculate safe lift position #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - z_park_delta) %}
    {% set z_safe = z_park_delta + act_z %}
  {% else %}
    {% set z_safe = max_z %}
  {% endif %}

  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83
    G1 E-{extrude} F2100
    {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}

  {% if "xyz" in printer.toolhead.homed_axes %}
    G90
    G1 Z{z_safe} F900
    G1 X{mv.park_x} Y{mv.park_y} F6000
    {% if printer.gcode_move.absolute_coordinates|lower == 'false' %} G91 {% endif %}
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %}
