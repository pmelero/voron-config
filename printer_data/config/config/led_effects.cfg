#####################################################################
#	LED Effects
#####################################################################
# Effect definitions for both LED chains:
#   neopixel:sb_leds    StealthBurner toolhead - GRBW - index 1 = logo, 2-3 = nozzle
#   neopixel:caselight  Chamber light - GRB - 36 LEDs
#
# IMPORTANT: sb_leds is an RGBW chain, so its palettes take four values
# (R,G,B,W). caselight is plain RGB and takes three (R,G,B).
#
# Effects are triggered from macros/led_macros.cfg. A chain driven by
# led_effect must not be driven by set_led at the same time.

#####################################################################
#	Toolhead - Logo (index 1)
#####################################################################

[led_effect sb_logo_ready]
leds:
    neopixel:sb_leds (1)
autostart:              false
frame_rate:             24
layers:
    breathing  6  0  top  (0.01,0.01,0.01,0.20)

[led_effect sb_logo_busy]
leds:
    neopixel:sb_leds (1)
autostart:              false
frame_rate:             24
layers:
    breathing  3  0  top  (0.40,0.00,0.00,0.00)

[led_effect sb_logo_homing]
leds:
    neopixel:sb_leds (1)
autostart:              false
frame_rate:             24
layers:
    breathing  4  0  top  (0.00,0.60,0.20,0.00)

[led_effect sb_logo_heating]
leds:
    neopixel:sb_leds (1)
autostart:              false
frame_rate:             24
layers:
    breathing  3  0  top  (0.30,0.18,0.00,0.00)

[led_effect sb_logo_leveling]
leds:
    neopixel:sb_leds (1)
autostart:              false
frame_rate:             24
layers:
    breathing  4  0  top  (0.50,0.10,0.40,0.00)

[led_effect sb_logo_meshing]
leds:
    neopixel:sb_leds (1)
autostart:              false
frame_rate:             24
layers:
    breathing  4  0  top  (0.20,1.00,0.00,0.00)

[led_effect sb_logo_cleaning]
leds:
    neopixel:sb_leds (1)
autostart:              false
frame_rate:             24
layers:
    breathing  4  0  top  (0.00,0.02,0.50,0.00)

[led_effect sb_logo_calibrating_z]
leds:
    neopixel:sb_leds (1)
autostart:              false
frame_rate:             24
layers:
    breathing  4  0  top  (0.80,0.00,0.35,0.00)

[led_effect sb_logo_printing]
leds:
    neopixel:sb_leds (1)
autostart:              false
frame_rate:             24
layers:
    static  0  0  top  (1.00,0.00,0.00,0.00)

[led_effect sb_logo_paused]
leds:
    neopixel:sb_leds (1)
autostart:              false
frame_rate:             24
layers:
    blink  1  0.5  top  (1.00,0.35,0.00,0.00)

[led_effect sb_logo_complete]
leds:
    neopixel:sb_leds (1)
autostart:              false
frame_rate:             24
layers:
    breathing  5  0  top  (0.00,1.00,0.00,0.00)

#####################################################################
#	Toolhead - Nozzle (index 2-3)
#####################################################################

[led_effect sb_nozzle_on]
leds:
    neopixel:sb_leds (2,3)
autostart:              false
frame_rate:             24
layers:
    static  0  0  top  (0.80,0.80,0.80,1.00)

[led_effect sb_nozzle_standby]
leds:
    neopixel:sb_leds (2,3)
autostart:              false
frame_rate:             24
layers:
    static  0  0  top  (0.60,0.00,0.00,0.00)

##	Cycles through the gradient until the extruder reaches its target.
[led_effect sb_nozzle_heating]
leds:
    neopixel:sb_leds (2,3)
autostart:              false
frame_rate:             24
heater:                 extruder
layers:
    heater  50  0  top  (0.30,0.10,0.00,0.00),(0.80,0.35,0.00,0.00),(1.00,0.00,0.00,0.00)

#####################################################################
#	Caselight - Manual
#####################################################################

##	Full brightness work light.
[led_effect case_on]
leds:
    neopixel:caselight
autostart:              false
frame_rate:             24
layers:
    static  0  0  top  (1.00,1.00,1.00)

##	Dimmed work light.
[led_effect case_mid]
leds:
    neopixel:caselight
autostart:              false
frame_rate:             24
layers:
    static  0  0  top  (0.30,0.30,0.30)

##	Idle breathing - starts automatically with Klipper.
[led_effect case_idle]
leds:
    neopixel:caselight
autostart:              true
frame_rate:             24
layers:
    static  0  0  top  (0.15,0.15,0.20)

#####################################################################
#	Caselight - Print Phases
#####################################################################

[led_effect case_homing]
leds:
    neopixel:caselight
autostart:              false
frame_rate:             24
layers:
    comet   2  1  add     (0.00,0.60,0.20),(0.00,0.20,0.05)
    static  0  0  bottom  (0.05,0.05,0.05)

##	Bed temperature from 0 to target, shown as a filling gauge.
[led_effect case_heating]
leds:
    neopixel:caselight
autostart:              false
frame_rate:             24
heater:                 heater_bed
layers:
    heatergauge  50  0  add     (1.00,0.40,0.00),(0.20,0.05,0.00)
    static        0  0  bottom  (0.05,0.05,0.05)

[led_effect case_leveling]
leds:
    neopixel:caselight
autostart:              false
frame_rate:             24
layers:
    chase   2  1  add     (0.50,0.10,0.40),(0.15,0.03,0.12)
    static  0  0  bottom  (0.05,0.05,0.05)

[led_effect case_meshing]
leds:
    neopixel:caselight
autostart:              false
frame_rate:             24
layers:
    gradient  1  1  add     (0.20,1.00,0.00),(0.00,0.20,0.00)
    static    0  0  bottom  (0.05,0.05,0.05)

[led_effect case_cleaning]
leds:
    neopixel:caselight
autostart:              false
frame_rate:             24
layers:
    cylon   3  0  add     (0.00,0.10,0.80)
    static  0  0  bottom  (0.05,0.05,0.05)

##	Work light with the print progress overlaid as a blue bar.
[led_effect case_printing]
leds:
    neopixel:caselight
autostart:              false
frame_rate:             24
layers:
    progress  -1  0  add     (0.00,0.00,0.40),(0.00,0.00,0.10)
    static     0  0  bottom  (0.50,0.50,0.50)

[led_effect case_paused]
leds:
    neopixel:caselight
autostart:              false
frame_rate:             24
layers:
    breathing  4  0  top  (1.00,0.35,0.00)

[led_effect case_complete]
leds:
    neopixel:caselight
autostart:              false
frame_rate:             24
layers:
    breathing  5  0  top  (0.00,1.00,0.00)

#####################################################################
#	Error - Runs Automatically On Klipper Shutdown
#####################################################################
# run_on_error keeps these alive when Klipper enters a shutdown state,
# so they need no macro to trigger them. Defined per chain because the
# two chains use different palette widths (RGB vs RGBW).

[led_effect case_error]
leds:
    neopixel:caselight
autostart:              false
frame_rate:             24
run_on_error:           true
layers:
    strobe  1  1.5  add  (1.00,0.00,0.00)

[led_effect sb_error]
leds:
    neopixel:sb_leds
autostart:              false
frame_rate:             24
run_on_error:           true
layers:
    strobe  1  1.5  add  (1.00,0.00,0.00,0.00)
