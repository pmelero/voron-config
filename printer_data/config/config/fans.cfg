#####################################################################
#	Fan Control
#####################################################################

[heater_fan hotend_fan]
##	Hotend Fan
pin: EBBCan: PA0
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
##	If you are experiencing back flow, you can reduce fan_speed
#fan_speed: 1.0

##	Part cooling fan - controlled by M106/M107
[fan]
pin: EBBCan: PA1

##	Controller fan - FAN2 Connector
[controller_fan controller_fan]
pin: PB2
kick_start_time: 0.5
stepper: stepper_x, stepper_y, stepper_z

[temperature_fan raspberry]
pin: PA14
sensor_type: temperature_host
control: watermark
target_temp: 60
max_power: 1.0
kick_start_time: 0.5
min_temp: 10
max_temp: 100

##	Bed Fans - control macros live in macros/bedfans_macros.cfg
[fan_generic BedFans]
pin: PC8
#cycle_time: 0.05
kick_start_time: 0.5
