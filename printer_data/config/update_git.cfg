[gcode_macro UPDATE_GIT]
description: Push the current config to GitHub via klipper-backup.
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{message}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}

# gcode_shell_command does not run through a shell, so the outer bash -c
# is what expands $HOME. In the _message variant, $0 is the first argument
# appended by PARAMS - that is the commit message.
[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

[gcode_shell_command update_git_script_message]
command: bash -c "bash $HOME/klipper-backup/script.sh $0"
timeout: 90.0
verbose: True
