#####################################################################
#	Fan Control
#####################################################################

[heater_fan hotend_fan]
##	Hotend Fan
pin: EBBCan:PA0
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
##	If you are experiencing back flow, you can reduce fan_speed
#fan_speed: 1.0

##	Part cooling fan - controlled by M106/M107
[fan]
pin: EBBCan:PA1

##	Stepper driver cooling - runs while any of these motors is enabled
[controller_fan electronics_bay]
pin: PB2
kick_start_time: 0.5
stepper: stepper_x, stepper_y, stepper_z

##	Electronics bay extractor, driven by the host CPU temperature.
##	The fan is a Noctua NF-A4x10 FLX (12 V, only + and - wired). The board
##	switches its supply and it only spins at 100 %: tested 2026-11-06, at
##	0-90 % the Pi warms exactly as with the fan off. So it runs on/off with
##	watermark: on at target_temp + max_delta (63 C), off at
##	target_temp - max_delta (57 C). PID and min_speed have no effect here.
[temperature_fan raspberry]
pin: PA14
sensor_type: temperature_host
control: watermark
target_temp: 60
max_delta: 3
max_speed: 1.0
max_power: 1.0
shutdown_speed: 1.0
kick_start_time: 0.5
min_temp: 10
max_temp: 100

##	Bed Fans - control macros live in macros/bedfans.cfg
[fan_generic bed_fans]
pin: PC8
#cycle_time: 0.05
kick_start_time: 0.5
