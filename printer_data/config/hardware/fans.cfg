#####################################################################
#	Fan Control
#####################################################################

[heater_fan hotend_fan]
##	Hotend Fan
pin: EBBCan:PA0
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
##	If you are experiencing back flow, you can reduce fan_speed
#fan_speed: 1.0

##	Part cooling fan - controlled by M106/M107
[fan]
pin: EBBCan:PA1

##	Stepper driver cooling - runs while any of these motors is enabled
[controller_fan electronics_bay]
pin: PB2
kick_start_time: 0.5
stepper: stepper_x, stepper_y, stepper_z

##	Electronics bay extractor, driven by the host CPU temperature.
##	PID keeps it spinning slowly (min_speed) and only speeds it up when the
##	Pi warms past target_temp, instead of watermark's 0 % / 100 % bursts.
##	The fan is a Noctua NF-A4x10 FLX (12 V, only + and - wired): the board
##	switches its supply, and below ~50 % it does not keep spinning reliably.
[temperature_fan raspberry]
pin: PA14
sensor_type: temperature_host
control: pid
pid_Kp: 2.0
pid_Ki: 5.0
pid_Kd: 0.5
target_temp: 55
min_speed: 0.5
max_speed: 1.0
max_power: 1.0
shutdown_speed: 1.0
kick_start_time: 0.5
min_temp: 10
max_temp: 100

##	Bed Fans - control macros live in macros/bedfans.cfg
[fan_generic bed_fans]
pin: PC8
#cycle_time: 0.05
kick_start_time: 0.5
