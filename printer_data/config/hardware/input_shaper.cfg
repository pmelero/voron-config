#####################################################################
#	Accelerometer / Resonance Testing
#####################################################################

[adxl345]
# Select 1 of the cs_pin below depending on the probe you have.
# Having the wrong one selected will cause an Endless Bootloop
# Cartographer V4 has int2 connected to the probes PA1 pin
cs_pin: cartographer:PA0 # For Cartographer V4
spi_bus: spi1

[resonance_tester]
probe_points: 150, 150, 20
accel_chip: adxl345

#####################################################################
#	Input Shaper
#####################################################################

[input_shaper]
shaper_freq_x: 57.0
shaper_type_x: mzv
shaper_freq_y: 42.4
shaper_type_y: mzv

[shaketune]
number_of_results_to_keep: 200
#   Counts PNG files per subfolder, not calibration runs: an input shaper run
#   writes two graphs (X and Y), so 200 here means 100 of those, while belts
#   writes one per run so it means 200. Deleting a graph also deletes its
#   matching .stdata. Note that 0 does NOT mean unlimited - it wipes the folder -
#   so "keep everything" means picking a number you will never reach.
#   Graphs average ~670 KB each and are backed up to git; the .stdata raw files
#   are ~4 MB each and stay excluded on purpose.

#   Every other [shaketune] option is left at its default; the plugin
#   documents them at https://github.com/Frix-x/klippain-shaketune
