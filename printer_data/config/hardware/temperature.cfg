#####################################################################
#	Temperature Sensors
#####################################################################

[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PC0
min_temp: 0
max_temp: 100
gcode_id: C

# Re-enabled 2026-11-06. It was disabled on 2026-10-20 because the STM32F446
# internal sensor returned false spikes (up to 221 C in ~22% of readings) that
# could trigger "ADC out of range" with max_temp 200. The likely cause was the
# caselight strip powered from the Spider, which now has its own 5 V supply.
# If the spikes come back, comment this section out again.
[temperature_sensor spider_mcu]
sensor_type: temperature_mcu
sensor_mcu: mcu
min_temp: 0
max_temp: 200

[temperature_sensor ebb36_mcu]
sensor_type: temperature_mcu
sensor_mcu: EBBCan
min_temp: 0
max_temp: 200

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105
