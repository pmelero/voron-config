#####################################################################
#	Extruder / Hotend
#####################################################################
# Toolhead stack: A4T with a Crossbow X carriage on a CNC XOL mount,
# WWBMG Dual extruder, Dragon Ace hotend, Cartographer probe.

##	In E0-MOT Position
[extruder]
step_pin: EBBCan:PD0
dir_pin: !EBBCan:PD1
enable_pin: !EBBCan:PD2
gear_ratio: 50:10
microsteps: 16
rotation_distance:  22.6789511
nozzle_diameter: 0.400
filament_diameter: 1.750

heater_pin: EBBCan:PB13

##	Dragon Ace with a PT1000, read by the MAX31865 on the EBB36.
##	Klipper only ever uses rtd_reference_r / rtd_nominal_r as a ratio
##	(see adc_to_resist_div_nominal in klippy/extras/spi_temperature.py),
##	so 4300/1000 and the 430/100 these used to say are numerically the
##	same. These values are the honest ones for a PT1000.
sensor_type: MAX31865
sensor_pin: EBBCan:PA4
spi_bus: spi1
rtd_nominal_r: 1000
rtd_reference_r: 4300
rtd_num_of_wires: 2

min_temp: 0
max_temp: 290
min_extrude_temp: 170
max_extrude_only_distance: 105
max_extrude_cross_section: 5

pressure_advance: 0.032
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: EBBCan:PA15
interpolate: false
run_current: 0.6
stealthchop_threshold: 0
