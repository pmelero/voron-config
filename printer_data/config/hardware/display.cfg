#####################################################################
#	Display
#####################################################################
# The screen on this machine is a BTT PITFT43 V2.0: a 4.3" touchscreen
# attached to the Raspberry Pi, exposed as /dev/fb0 and driven by
# KlipperScreen. Klipper never talks to it, so there is no [display]
# section here - the mini12864 one that used to live in this file was
# left over from the stock Voron template and configured hardware that
# is not on this printer.
#
# [display_status] is still needed, and must be declared by hand. It is
# what provides M117 and SET_DISPLAY_TEXT, which PRINT_START, PRINT_END,
# _CLEAN_NOZZLE and both filament sensors use. A [display] section would
# have loaded it implicitly (see load_object in klippy/extras/display/
# display.py), so removing one without adding this breaks those macros
# at print time rather than at startup.

[display_status]
