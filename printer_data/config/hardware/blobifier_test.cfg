#####################################################################
#   TEMPORAL (2026-11-26): prueba del servo y del interruptor de Blobifier
#   sin Happy Hare (MMU desactivada). Usa los mismos pines y valores que
#   hardware/blobifier.cfg: al reactivar la MMU y Blobifier, quitar el
#   include de este archivo (si no, PA1 y PA2 quedarian duplicados).
#
#   Prueba 2 (2026-11-26): servo entero en el conector BL Touch
#   (GND, 5V y senal en PA2) para descartar PA1. Interruptor del cubo
#   desactivado: tiene que estar desconectado de PA2 (si estuviera cerrado,
#   pondria a GND la senal del servo).
#####################################################################

[servo blobifier]
pin                      : PA2
minimum_pulse_width      : 0.00053
maximum_pulse_width      : 0.0023
maximum_servo_angle      : 180

#[gcode_button bucket]
#pin                      : ^PA2
#debounce_delay           : 0.5
#press_gcode:
#  RESPOND PREFIX="BLOBIFIER" MSG="Bucket switch pressed (bucket installed)"
#release_gcode:
#  RESPOND PREFIX="BLOBIFIER" MSG="Bucket switch released (bucket removed)"

# Igual que el BLOBIFIER_SERVO de Happy Hare en modo servo: mueve, espera
# dwell_time (ms) y corta la senal. DWELL=<ms> permite probar otro tiempo.
[gcode_macro BLOBIFIER_SERVO]
description: TEMPORAL - mueve la bandeja de Blobifier (POS=in|out [DWELL=ms]) sin Happy Hare
variable_angle_in: 180
variable_angle_out: 0
variable_dwell_time: 200
gcode:
  {% set pos = params.POS|default("")|lower %}
  {% if pos == "in" %}
    SET_SERVO SERVO=blobifier ANGLE={angle_in}
  {% elif pos == "out" %}
    SET_SERVO SERVO=blobifier ANGLE={angle_out}
  {% else %}
    {action_raise_error("BLOBIFIER_SERVO: usa POS=in o POS=out")}
  {% endif %}
  G4 P{params.DWELL|default(dwell_time)|int}
  SET_SERVO SERVO=blobifier WIDTH=0
