#####################################################################
#	Filament Sensors
#####################################################################
##	Both sensors are gated on print_stats. Klipper's own gate is
##	idle_timeout == "Printing", which means nothing more than "the toolhead
##	moved within the last idle_timeout" - 1800 s here. A manual load, unload or
##	a single extrude jog from the touchscreen sets it, so tugging the filament
##	out by hand trips a runout and pauses an idle printer. Only a real job in
##	progress should ever be interrupted.

##	Before the extruder gears. Trips when the spool runs out or the filament
##	snaps upstream. There is still material loaded past this point, so there
##	is a little time to react.
[filament_switch_sensor extruder_entry]
switch_pin: ^EBBCan:PB6
pause_on_runout: False
runout_gcode:
    {% if printer.print_stats.state == "printing" %}
      SET_DISPLAY_TEXT MSG="Filament out at the extruder entry"
      M600
    {% else %}
      RESPOND MSG="Filament left the extruder entry sensor - no print running, ignored"
    {% endif %}

##	After the extruder gears. Trips when filament stops reaching the hotend -
##	stripped, snapped or fully consumed. The nozzle runs dry within a few
##	millimetres, so this is the urgent one.
##
##	Deliberately NOT M600: that ends in UNLOAD_FILAMENT, which only works
##	while the gears still grip the filament. By the time this sensor trips
##	the filament is already past them, so unloading would spin on air.
##	Pause instead and load new filament by hand.
[filament_switch_sensor extruder_exit]
switch_pin: ^EBBCan:PB5
pause_on_runout: False
runout_gcode:
    {% if printer.print_stats.state == "printing" %}
      SET_DISPLAY_TEXT MSG="Filament past the gears - load new filament"
      PAUSE
    {% else %}
      RESPOND MSG="Filament left the extruder exit sensor - no print running, ignored"
    {% endif %}
