#####################################################################
#	Probe
#####################################################################
[mcu cartographer]
canbus_uuid: 623c5a948da6

[cartographer]
mcu: cartographer
##	Offset from the nozzle tip to the centre of the coil.
x_offset: 0
y_offset: 21.65
verbose: yes

[cartographer coil]
##	The leading underscore hides the coil temperature sensor in Mainsail and
##	KlipperScreen. The plugin reads the coil temperature straight from the
##	probe, so this name is only used for display.
name: _cartographer_coil

[bed_mesh]
##	mesh_min/mesh_max are probe coordinates, not nozzle coordinates: the
##	coil sits 21.65mm behind the nozzle in Y (y_offset above), which is
##	what keeps the probe on the bed at the near edge.
zero_reference_position: 150, 150
speed: 300
horizontal_move_z: 3
mesh_min: 40, 40
mesh_max: 260, 260
probe_count: 20, 20
adaptive_margin: 10
mesh_pps: 0, 0                   # no interpolation - 20x20 is dense enough
