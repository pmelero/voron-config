#####################################################################
#	Homing and Gantry Adjustment Routines
#####################################################################

[safe_z_home]
##	There is no Z endstop switch on this machine: Z homing is done
##	by the Cartographer probe. This is just where it probes.
home_xy_position:150,150
speed:100
z_hop:10

[quad_gantry_level]
##	gantry_corners are the belt positions measured from the nozzle at
##	(0,0) and at (300,300). points are where the gantry is probed.

##	Gantry corners for this 300mm build
gantry_corners:
	-60,-10
	360,370
#	Probe points
points:
	50,25
	50,225
	250,225
	250,25

speed: 200
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
max_adjust: 10
